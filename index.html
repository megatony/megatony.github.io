<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e13">
<title>megatony · projects</title>
<style>
  body { margin:0; font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:#0b0e13; color:#f3f5f8; }
  main { max-width:760px; margin:0 auto; padding:56px 24px; }
  h1 { font-size:32px; margin:0 0 4px; }
  .sub { color:#9aa4b2; margin:0 0 32px; }
  a.card { display:flex; gap:18px; align-items:center; text-decoration:none; color:inherit; background:#151a22; border:1px solid #2a3342;
    border-radius:18px; padding:22px 24px; transition:border-color .15s; }
  a.card:hover { border-color:#22c55e; }
  .icon { width:52px; height:52px; border-radius:14px; background:#22c55e; display:grid; place-items:center; flex:none; font-size:28px; }
  .title { font-size:22px; font-weight:700; }
  .desc { color:#9aa4b2; font-size:16px; }
  footer { color:#6b7280; font-size:14px; margin-top:40px; }
  footer a { color:#9aa4b2; }
</style>
</head>
<body>
<main>
  <h1>megatony</h1>
  <p class="sub">Small projects by Bahadır Akın Akgül</p>
  <a class="card" href="/swm-charge-finder/">
    <div class="icon" aria-hidden="true">⚡</div>
    <div>
      <div class="title">SWM Charge Finder</div>
      <div class="desc">Nearest Stadtwerke München EV charger, one tap to navigate. Built for the Tesla browser.</div>
    </div>
  </a>
  <footer><a href="https://github.com/megatony">github.com/megatony</a></footer>
